<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.halo{animation:halo 3.6s ease-out infinite}@keyframes halo{0%{opacity:0}6%{opacity:.75}20%,100%{opacity:0}}
.dash{animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
</style>
<defs>
