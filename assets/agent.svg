<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.halo{opacity:0;animation:halo 4.2s ease-out infinite}
@keyframes halo{0%{opacity:0}5%{opacity:.9}16%{opacity:0}100%{opacity:0}}
.dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}

</style>
<defs>
  <clipPath id="card"><rect x="0.5" y="0.5" width="999" height="299" rx="14"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#card)">
<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#484f58"/></marker>
<marker id="arrT" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#00a08a"/></marker></defs><rect width="1000" height="300" fill="url(#dots)" opacity="0.35"/>
<text x="28" y="34" font-size="13" fill="#8b949e">// the model sits at the edges. everything that has to be right is code.</text><line x1="148" y1="150" x2="161" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/><line x1="283" y1="150" x2="296" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/><line x1="418" y1="150" x2="431" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/><line x1="553" y1="150" x2="566" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/><line x1="688" y1="150" x2="701" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/><line x1="823" y1="150" x2="836" y2="150" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/><path d="M764 122 C764 58 494 58 494 118" fill="none" stroke="#00a08a" stroke-dasharray="4 4" marker-end="url(#arrT)" class="dash"/>
<text x="629" y="70" font-size="11" fill="#8b949e" text-anchor="middle">slot taken → search again</text>
<path d="M359 178 C359 242 89 242 89 182" fill="none" stroke="#00a08a" stroke-dasharray="4 4" marker-end="url(#arrT)" class="dash"/>
<text x="224" y="238" font-size="11" fill="#8b949e" text-anchor="middle">field missing → ask, don't guess</text><text x="224" y="106" font-size="11" fill="#00d4b4" text-anchor="middle">language in</text>
<text x="899" y="106" font-size="11" fill="#00d4b4" text-anchor="middle">language out</text><circle r="4.5" fill="#00d4b4"><animateMotion dur="4.2s" begin="0.00s" repeatCount="indefinite" path="M89 150 L899 150"/></circle><circle r="4.5" fill="#00d4b4"><animateMotion dur="4.2s" begin="-1.40s" repeatCount="indefinite" path="M89 150 L899 150"/></circle><circle r="4.5" fill="#00d4b4"><animateMotion dur="4.2s" begin="-2.80s" repeatCount="indefinite" path="M89 150 L899 150"/></circle><rect x="27" y="119" width="124" height="62" rx="12" fill="none" stroke="#00d4b4" stroke-width="3" filter="url(#glow)" class="halo" style="animation-delay:-0.25s"/>
<rect x="30" y="122" width="118" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="89" y="146" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">message</text>
<text x="89" y="165" font-size="11" fill="#8b949e" text-anchor="middle" opacity="1">user text</text><rect x="162" y="119" width="124" height="62" rx="12" fill="none" stroke="#00d4b4" stroke-width="3" filter="url(#glow)" class="halo" style="animation-delay:0.45s"/>
<rect x="165" y="122" width="118" height="56" rx="10" fill="#00d4b4" stroke="#00d4b4" stroke-width="1.5"/>
<text x="224" y="146" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">parse</text>
<text x="224" y="165" font-size="11" fill="#0d1117" text-anchor="middle" opacity="0.8">→ Intent(json)</text><rect x="297" y="119" width="124" height="62" rx="12" fill="none" stroke="#00d4b4" stroke-width="3" filter="url(#glow)" class="halo" style="animation-delay:1.15s"/>
<rect x="300" y="122" width="118" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="359" y="146" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">frame</text>
<text x="359" y="165" font-size="11" fill="#8b949e" text-anchor="middle" opacity="1">missing? ask</text><rect x="432" y="119" width="124" height="62" rx="12" fill="none" stroke="#00d4b4" stroke-width="3" filter="url(#glow)" class="halo" style="animation-delay:1.85s"/>
<rect x="435" y="122" width="118" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="494" y="146" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">retrieve</text>
<text x="494" y="165" font-size="11" fill="#8b949e" text-anchor="middle" opacity="1">indexed query</text><rect x="567" y="119" width="124" height="62" rx="12" fill="none" stroke="#00d4b4" stroke-width="3" filter="url(#glow)" class="halo" style="animation-delay:2.55s"/>
<rect x="570" y="122" width="118" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="629" y="146" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">rank</text>
<text x="629" y="165" font-size="11" fill="#8b949e" text-anchor="middle" opacity="1">score(prefs)</text><rect x="702" y="119" width="124" height="62" rx="12" fill="none" stroke="#00d4b4" stroke-width="3" filter="url(#glow)" class="halo" style="animation-delay:3.25s"/>
<rect x="705" y="122" width="118" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="764" y="146" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">verify</text>
<text x="764" y="165" font-size="11" fill="#8b949e" text-anchor="middle" opacity="1">slot ∈ free</text><rect x="837" y="119" width="124" height="62" rx="12" fill="none" stroke="#00d4b4" stroke-width="3" filter="url(#glow)" class="halo" style="animation-delay:3.95s"/>
<rect x="840" y="122" width="118" height="56" rx="10" fill="#00d4b4" stroke="#00d4b4" stroke-width="1.5"/>
<text x="899" y="146" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">reply</text>
<text x="899" y="165" font-size="11" fill="#0d1117" text-anchor="middle" opacity="0.8">→ text</text><rect x="28" y="266" width="12" height="12" rx="3" fill="#00d4b4"/>
<text x="48" y="276" font-size="12" fill="#8b949e">llm call</text>
<rect x="128" y="266" width="12" height="12" rx="3" fill="#161b22" stroke="#8b949e"/>
<text x="148" y="276" font-size="12" fill="#8b949e">plain code over typed state</text>
<text x="972" y="276" font-size="12" fill="#484f58" text-anchor="end">langgraph · StateGraph · 2 of 7 nodes call a model</text>
</g>
</svg>
